<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1a1a2e" stroke="#7c3aed" stroke-width="2"/>

  <!-- d20 hex body -->
  <polygon
    points="50,8 90,33 90,67 50,92 10,67 10,33"
    fill="#2d1b69"
    stroke="#7c3aed"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Top triangle -->
  <polygon
    points="50,8 90,33 10,33"
    fill="none"
    stroke="#a78bfa"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <!-- Bottom triangle -->
  <polygon
    points="50,92 90,67 10,67"
    fill="none"
    stroke="#a78bfa"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <!-- Inner lines to center -->
  <line x1="10" y1="33" x2="50" y2="50" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="90" y1="33" x2="50" y2="50" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="10" y1="67" x2="50" y2="50" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="90" y1="67" x2="50" y2="50" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="50" y1="8"  x2="50" y2="33" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="50" y1="67" x2="50" y2="92" stroke="#a78bfa" stroke-width="1.2"/>

  <!-- "20" in the center face -->
  <text
    x="50"
    y="56"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="18"
    font-weight="bold"
    fill="#e9d5ff"
    letter-spacing="1"
  >20</text>
</svg>
