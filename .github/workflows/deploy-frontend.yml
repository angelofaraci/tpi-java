name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read
  id-token: write

env:
  VITE_API_BASE_URL: https://tpi-java-backend-72340600454.southamerica-east1.run.app

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/72340600454/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@tpi-java-app.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        working-directory: .
        run: npx --yes firebase-tools@latest deploy --only hosting --project tpi-java-app --non-interactive
