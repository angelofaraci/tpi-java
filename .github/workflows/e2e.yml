name: E2E

# Dedicated, non-blocking workflow (spec.md "Non-Blocking CI Workflow"): deliberately
# has no `needs:` relation to deploy-backend.yml or deploy-frontend.yml, and neither
# of those reference this workflow, so a red E2E run never gates a deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend against the fixed e2e backend port
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:18080

      - name: Start the frontend preview server
        working-directory: frontend
        run: npx vite preview --port 4173 --strictPort &

      - name: Wait for the frontend preview server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Frontend preview is up"
              exit 0
            fi
            sleep 1
          done
          echo "Frontend preview did not come up in time" >&2
          exit 1

      - name: Verify headless Chrome is available (Selenium Manager resolves the matching driver)
        run: google-chrome --version

      - name: Run the E2E suite
        working-directory: backend
        run: ./mvnw -B verify -Pe2e

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failsafe-reports
          path: backend/target/failsafe-reports/
          if-no-files-found: ignore
