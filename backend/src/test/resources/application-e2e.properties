# E2E profile overrides for application.properties.
# Fixed port: the frontend production build bakes VITE_API_BASE_URL at build
# time, so the backend port must be known before the JVM starts (see design.md).
server.port=18080

# vite preview (production build) serves on 4173, not the 5173 dev-server port
# already allowed in application.properties.
app.cors.allowed-origins=http://localhost:4173,http://127.0.0.1:4173
