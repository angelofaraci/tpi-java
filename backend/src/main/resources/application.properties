spring.application.name=dndsheets
spring.datasource.url=jdbc:postgresql://localhost:55443/postgres?options=-c%20TimeZone%3DUTC
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# Postgres Large Objects (used by @Lob fields like DndClassEntity.levelCharacteristics)
# require a real transaction — HikariCP's default auto-commit breaks LOB reads/writes.
spring.datasource.hikari.auto-commit=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# Storage provider: "local" (default, for dev) or "gcs" (Cloud Run/production)
app.storage.provider=local
app.storage.gcs.bucket=${STORAGE_BUCKET:}

# JWT signing key — overridden via Secret Manager in production, this default is for local dev only
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}

# CORS allowed origins — comma-separated, overridden in production with the deployed frontend URL
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
